ited:!1,source:"demo"}));return{id:as(),title:"[샘플] 미래산업 국정감사 — 반도체 소부장·인력 현황",createdAt:n,updatedAt:n,segments:t,notes:`※ 샘플 데이터입니다 (가상의 회의).
