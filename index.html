원님들께 보고드리겠습니다.",!1],[297,318,"참고인","참고로 산업계 입장에서 말씀드리면, 중소 부품업체는 대기업과의 단가 협상에서 국산화 투자를 회수하기 어려운 구조입니다. 수요기관의 국산 제품 우선 조달 제도가 실효성 있게 운영될 필요가 있습니다.",!0],[319,344,"위원","좋은 지적입니다. 우선 조달 제도 개선안도 함께 자료로 제출해 주시고요. 오늘 지적된 사항은 세 가지로 정리하겠습니다. 첫째 소부장 지원 성과관리 강화, 둘째 청년 인력 유출 대책 실효화, 셋째 국산 제품 우선조달 개선입니다.",!1],[345,358,"사회자","이어서 질의하실 위원님 계십니까? 없으시면 오늘 회의는 여기까지 마치겠습니다. 수고하셨습니다.",!1]].map(([s,i,r,a,o])=>({id:jn(),start:s,end:i,speaker:r,text:a,bookmark:o,edited:!1,source:"demo"}));return{id:jn(),title:"[샘플] 미래산업 국정감사 — 반도체 소부장·인력 현황",createdAt:n,updatedAt:n,segments:t,notes:`※ 샘플 데이터입니다 (가상의 회의).
